# nginx proxy address - http://172.17.0.1:8094

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  xibo:
    image: xibosignage/xibo-cms:latest
    container_name: xibo-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - xibo
    ports:
      - "8094:80"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./rootfs/data/xibo:/data
      - ./rootfs/config/xibo:/config
    depends_on:
      - xibo-db

  xibo-db:
    image: mariadb:11
    container_name: xibo-db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - xibo
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-xibo}
      MARIADB_USER: ${DB_USER_NAME:-xibo}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_root_password}
    volumes:
      - ./rootfs/db/mariadb/xibo:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  xibo:
    external: false
