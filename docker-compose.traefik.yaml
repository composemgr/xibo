name: xibo
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: xibosignage/xibo-cms:latest
    container_name: xibo-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: xibo-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      MYSQL_HOST: xibo-db
      MYSQL_DATABASE: ${DB_CREATE_DATABASE_NAME:-xibo}
      MYSQL_USER: ${DB_USER_NAME:-xibo}
      MYSQL_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      MYSQL_PASSWORD_ADMIN: ${DB_ADMIN_PASS:-replace-with-a-random-password}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_general_ci
      XMR_HOST: xibo-xmr
      XMR_PUB_ADDRESS: tcp://xibo-xmr:9505
      XIBO_DEV_MODE: 'false'
    volumes:
      - './volumes/data/xibo/cms:/var/www/cms/custom:z'
      - './volumes/data/xibo/library:/var/www/cms/library:z'
    depends_on:
      xibo-db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.xibo-app.entrypoints=http'
      - 'traefik.http.routers.xibo-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.xibo-app.middlewares=xibo-app-https-redirect'
      - 'traefik.http.middlewares.xibo-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.xibo-app-secure.entrypoints=https'
      - 'traefik.http.routers.xibo-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.xibo-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.xibo-app-secure.service=xibo-app'
      - 'traefik.http.services.xibo-app.loadbalancer.server.port=80'
    networks:
      - xibo
      - traefik

  xibo-xmr:
    image: xibosignage/xibo-xmr:latest
    container_name: xibo-xmr
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: xibo-xmr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: xibo-xmr
    networks:
      - xibo

  xibo-db:
    image: mariadb:latest
    container_name: xibo-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: xibo-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: xibo-db
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-xibo}
      MARIADB_USER: ${DB_USER_NAME:-xibo}
      MARIADB_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/mariadb/xibo:/var/lib/mysql:z'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - xibo

networks:
  xibo:
    name: xibo
    external: false
  traefik:
    external: true
